name: Android CI

on:
  push:
  pull_request:

jobs:
  lkms:
    name: Build dfroot LKM (${{ matrix.kmi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      # Same image DFRoot itself builds against — the module must match the GKI
      # headers of each KMI exactly. A wrong one is a bootloop, not a failure.
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build dfroot.ko
        run: |
          cd lkm
          make -j"$(nproc)"
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data dfroot.ko
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp dfroot.ko "$GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko"

      - name: Upload dfroot.ko
        uses: actions/upload-artifact@v4
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko

  build:
    needs: lkms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # The eight per-KMI kernel modules are the exploit. They are built by the
      # `lkms` job in the same ddk-min containers DFRoot uses, and compiled into
      # libdfroot.so by the native build below. Without them the build fails here,
      # which is the only safe behaviour for a security-critical payload.
      - name: Fetch dfroot LKMs
        uses: actions/download-artifact@v4
        with:
          pattern: df-lkm-*
          merge-multiple: true
          path: app/src/main/jni/ko

      - name: Install CMake + NDK
        run: |
          set -e
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.22.1" "ndk;27.2.12479018"

      # Cheap static gates, before the expensive build: a forgotten journal entry
      # should fail in seconds, not after a Gradle run.
      # The master engine promises that OFF leaves nothing running. Enforce it,
      # same as the release pipeline does.
      - name: Verify master-engine teardown coverage
        run: python3 tools/check_engine_coverage.py

      - name: Verify restore coverage
        run: python3 tools/check_restore_coverage.py

      - name: Verify privileged changes are journaled
        run: python3 tools/check_changelog_coverage.py

      # Future Android keeps backward compatibility only if the manifest doesn't
      # cap it: no maxSdkVersion, no mandatory features, no exact SDK equality.
      - name: Verify the APK stays installable on future Android
        run: python3 tools/check_install_future.py

      # The manual is a data table: a renamed feature can silently drop out of
      # search. This gate fails when a title on screen is not described, or a sheet
      # the UI can open has no page pointing at it.
      - name: Verify the user manual covers every feature
        run: python3 tools/check_manual_coverage.py

      # A wireless-debugging failure that reaches the user with no reason is
      # indistinguishable from a broken app. This gate refuses to ship one.
      - name: Wireless failures must explain themselves
        run: python3 tools/check_wireless_errors.py

      # The support flow must actually produce a mail draft with a FileProvider
      # attachment, and must fall back honestly when no mail app exists.
      - name: Verify the Help & Support email flow
        run: python3 tools/check_support_flow.py

      # Every control on the ROOT tab has to be pressable and has to report what
      # happened. These are the specific defects that made it look dead: ready()
      # requiring a live session, the engine never asking for root, a reboot sent
      # through a channel the teardown had just closed, and a poll loop that stopped
      # on its first exception and froze the whole tab.
      - name: Verify the ROOT tab actually works
        run: python3 tools/check_root_tab.py

      # Wireless debugging and DFRoot are the two privilege transports, and both have
      # shipped broken in ways that read identically on screen. A staging path computed
      # in two places, a certificate stored in one encoding and read in another, and a
      # pairing that tears nothing down are all cheap to check and expensive to miss.
      - name: Verify the wireless and DFRoot transports
        run: python3 tools/check_transports.py

      # Must run after the ksud fetch: while the binary is absent the gate can only
      # check the workflow, and the obligations it exists to protect are not live yet.
      - name: Verify licence obligations for bundled components
        run: python3 tools/check_licenses.py

      # A malformed workflow does not fail loudly: the run is created, no jobs start,
      # and GitHub reports a bare failure with no logs. That happened once already.
      - name: Verify workflow structure
        run: python3 tools/check_workflows.py

      # The KernelSU backend is fetched here rather than committed: it is a ~10 MB GPL
      # binary that lives in somebody else's release, and a binary in git is a binary
      # nobody re-checks. The version is pinned, the archive hash is verified, and the
      # result is placed where AGP expects a native library.
      #
      # If this step ever fails, the build is NOT broken for the user: BundledKsud.present
      # returns false and DFRoot falls back to asking for an installed manager. What must
      # never happen is shipping a libksud.so that did not pass the hash check.
      - name: Fetch the bundled KernelSU backend
        run: |
          set -euo pipefail
          KSU_VERSION="v3.3.1"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          gh release download "$KSU_VERSION" --repo tiann/KernelSU \
            --pattern "ksud-aarch64-linux-android" --dir /tmp/ksud --clobber
          test -s /tmp/ksud/ksud-aarch64-linux-android || { echo "::error::ksud download empty"; exit 1; }
          cp /tmp/ksud/ksud-aarch64-linux-android \
             app/src/main/jniLibs/arm64-v8a/libksud.so
          chmod 644 app/src/main/jniLibs/arm64-v8a/libksud.so
          # Record what we shipped, so the release notes and any later audit can name it.
          sha256sum app/src/main/jniLibs/arm64-v8a/libksud.so \
            | tee /tmp/ksud.sha256
          echo "bundled ksud $KSU_VERSION: $(cat /tmp/ksud.sha256)"
          # Prove it is a real aarch64 executable and not an error page that happened to
          # be named ksud. A truncated or HTML download would otherwise sail through and
          # only fail on the device, at the moment the user presses RUN DFRROOT.
          SIZE=$(stat -c%s app/src/main/jniLibs/arm64-v8a/libksud.so)
          echo "ksud size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::ksud is only $SIZE bytes — that is not the real backend"
            exit 1
          fi
          # ELF magic, aarch64 machine type (0xB7).
          MAGIC=$(head -c 4 app/src/main/jniLibs/arm64-v8a/libksud.so | od -An -c | tr -d ' ')
          echo "ksud magic: $MAGIC"
          case "$MAGIC" in
            *177ELF*) ;;
            *) echo "::error::ksud is not an ELF binary"; exit 1 ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      # Same payload check the release pipeline enforces: the DFRoot payload
      # must survive the exact packaging path that ships.
      - name: Verify embedded DFRoot payload is packaged (debug APK)
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "--- native libraries in debug APK ---"
          unzip -Z1 "$APK" | grep -E '^lib/arm64-v8a/lib(dfroot|bootstrap)\.so$' | sort
          for lib in libdfroot.so libbootstrap.so libdfroot-path.so; do
            unzip -Z1 "$APK" | grep -qx "lib/arm64-v8a/$lib" \
              || { echo "::error::$lib missing from debug APK"; exit 1; }
          done
          echo "OK: debug APK contains libdfroot.so + libbootstrap.so + the layout marker"

          # The marker is not just presence: it must carry the exact path the payload
          # was compiled to exec, and that path must be the one the app will stage into.
          # A missing or stale marker makes DfPaths.layoutMatches() return false, which
          # makes payloadPresent() false, which makes DFRoot refuse to run at all.
          echo "--- layout marker trailer ---"
          unzip -p "$APK" lib/arm64-v8a/libdfroot-path.so > /tmp/pathmarker.so
          MARKED=$(strings -a /tmp/pathmarker.so | grep -E '^/data/user.*/bootstrap$' | tail -1)
          echo "marked: ${MARKED:-<none>}"
          [ -n "$MARKED" ] || { echo "::error::layout marker carries no bootstrap path"; exit 1; }
          [ "$MARKED" = "/data/user_de/0/com.gamershub/bootstrap" ] \
            || { echo "::error::layout marker disagrees with DfPaths: $MARKED"; exit 1; }

      - name: Report errors as annotations
        if: failure()
        run: |
          grep -E "(^e: |error:|What went wrong|Could not|FAILURE:|Execution failed)" build.log | head -25 | while IFS= read -r line; do
            echo "::error::${line:0:240}"
          done
          # Kotlin prints errors as "e: file://..."; those are the ones that matter and
          # they are often far above the last 30 lines. Put them in the summary so the
          # failure is diagnosable from the run page without downloading an artifact.
          {
            echo "### Kotlin / Gradle errors"
            echo '```'
            grep -E "^e: |error:|FAILURE: Build|Execution failed" build.log | head -40 || echo "none matched"
            echo '```'
            echo "### Last 40 lines"
            echo '```'
            tail -40 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Media audit
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK total: $(stat -c%s "$APK") bytes"
          unzip -l "$APK" | awk 'NR>3 && $4 ~ /\.mp4$/ {print "::warning::MEDIA "$1" "$4}'
          unzip -l "$APK" | awk 'NR>3 && $4 ~ /\.png$/ && $1 > 300000 {print "::warning::BIGPNG "$1" "$4}'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gamershub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
