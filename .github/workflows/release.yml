name: Build & Release APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare release keystore
        run: |
          if [ -f keystore/gamershub.p12 ]; then
            # Normalise the committed PKCS12 into a JKS with the standard alias so
            # every release after this one is signed with the SAME certificate
            # (in-place updates keep the Shizuku grant and all app data).
            keytool -importkeystore -noprompt \
              -srckeystore keystore/gamershub.p12 -srcstoretype PKCS12 \
              -srcstorepass gamershub -srcalias gamershub \
              -destkeystore gamershub.jks -deststoretype JKS \
              -deststorepass gamershub -destkeypass gamershub -destalias gamershub
          else
            keytool -genkeypair -v \
              -keystore gamershub.jks -keyalg RSA -keysize 2048 -validity 10000 \
              -alias gamershub -storepass gamershub -keypass gamershub \
              -dname "CN=GamersHub, OU=App, O=GamersHub, C=US"
          fi

      - name: Build signed release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$PWD/gamershub.jks" \
            -Pandroid.injected.signing.store.password=gamershub \
            -Pandroid.injected.signing.key.alias=gamershub \
            -Pandroid.injected.signing.key.password=gamershub 2>&1 | tee build.log

      # Keep the compiler output reachable even when the build fails, so a
      # Kotlin error can be read without downloading runner logs.
      - name: Capture build diagnostics
        if: failure()
        run: |
          {
            echo "BUILD FAILED"
            echo "--- first 80 error/diagnostic lines ---"
            grep -nE "(^e: |error:|warning: .*\.kt|What went wrong|FAILURE:|Execution failed)" build.log | head -80 || true
            echo "--- tail ---"
            tail -40 build.log || true
          } > verify-report.txt

      # Hard gate: the shipped artifact must be a *signed release* build, not a
      # debug build. Signing identity is pinned to the committed keystore so an
      # accidental re-sign with debug keys fails the run instead of shipping.
      # Every check is echoed to the job summary so the result is auditable
      # without downloading logs.
      - name: Verify release artifact
        run: |
          set -u
          REPORT=verify-report.txt
          : > "$REPORT"
          say() { echo "$*" | tee -a "$REPORT"; }
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          say "APK: $APK"
          say "size: $(stat -c%s "$APK") bytes"

          fail() { echo "::error::$1"; say "FAIL: $1"; exit 1; }

          # ---------- signature ----------
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort | tail -1)
          say "apksigner: ${APKSIGNER:-<not found>}"
          test -n "$APKSIGNER" || fail "apksigner not found in the Android SDK"
          if ! "$APKSIGNER" verify --verbose --print-certs "$APK" > sign.txt 2>&1; then
            say "FAIL: apksigner verify error"
            cat sign.txt | tee -a "$REPORT"
            fail "apksigner verify failed"
          fi
          say "--- apksigner (full) ---"
          cat sign.txt | tee -a "$REPORT"

          # minSdk is 26, so a v2-only signature is correct; v1 (JAR signing) is
          # only required for minSdk < 24 and must not be demanded here.
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" sign.txt \
            || fail "APK signature scheme v2 did not verify"

          # the line is prefixed by the scheme, e.g. "V2 Signer: certificate SHA-256 digest: ..."
          CERT_SHA256=$(sed -n 's/.*certificate SHA-256 digest: *//p' sign.txt | head -1)
          say "cert SHA-256: ${CERT_SHA256:-<empty>}"
          test "$CERT_SHA256" = "463c72645dbdaaab2e096dc53a6e82bb99ff591eaab221ba30f3b611945c16e0" \
            || fail "not signed with the release keystore"
          say "OK: signed with release keystore (v2)"

          # ---------- identity ----------
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 2>/dev/null | sort | tail -1)
          say "aapt2: $AAPT"
          "$AAPT" dump badging "$APK" > badging.txt 2>&1 || true
          say "--- badging (first 8 lines) ---"
          head -8 badging.txt | tee -a "$REPORT"

          grep -q "name='com.gamershub'" badging.txt || fail "package name is not com.gamershub"
          grep -q "versionCode='85'" badging.txt || fail "versionCode is not 85"
          if grep -qi "application-debuggable" badging.txt; then
            fail "APK is debuggable - refusing to publish a debug build"
          fi
          say "OK: com.gamershub 85, not debuggable"

          # ---------- dex sanity ----------
          say "--- dex entries ---"
          unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$' | tee -a "$REPORT" || true

          say "RESULT: PASS"
          {
            echo "### Release artifact verification"
            echo ""
            echo '```'
            cat "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Media audit
        run: |
          set -u
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK total: $(stat -c%s "$APK") bytes"
          unzip -l "$APK" | awk 'NR>3 && $4 ~ /\.mp4$/ {print "::warning::MEDIA "$1" "$4}'
          unzip -l "$APK" | awk 'NR>3 && $4 ~ /\.png$/ && $1 > 300000 {print "::warning::BIGPNG "$1" "$4}'
          unzip -l "$APK" | awk 'NR>3 && $4 ~ /mipmap/ {print "::notice::ICON "$1" "$4}'

          # Both intro masters must ship AND must still carry their audio track.
          # The app plays them through MediaPlayer, so a silent or missing track
          # is a broken intro - fail instead of shipping it.
          #
          # Release builds shorten resource paths (res/raw/foo.mp4 -> res/xx.mp4),
          # so the clips are located by their declared resource name via aapt2 and
          # then confirmed by their real pixel dimensions.
          which ffprobe >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          rc=0
          say() { echo "$*"; echo "$*" >> verify-report.txt; }

          echo "--- packaged .mp4 entries ---" > /tmp/mp4list.txt
          unzip -Z1 "$APK" | grep -E '\.mp4$' >> /tmp/mp4list.txt || true
          cat /tmp/mp4list.txt >&2

          want_portrait=0
          want_landscape=0
          while IFS= read -r m; do
            case "$m" in *.mp4) ;; *) continue ;; esac
            unzip -p "$APK" "$m" > /tmp/probe.mp4
            dims=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
                     -of csv=p=0:s=x /tmp/probe.mp4 2>/dev/null || true)
            aud=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,channels \
                     -of csv=p=0 /tmp/probe.mp4 2>/dev/null || true)
            say "  $m  dims=${dims:-?} audio=${aud:-none}"
            [ -n "$aud" ] || continue
            case "$dims" in
              1080x1920) want_portrait=1 ;;
              1920x1080) want_landscape=1 ;;
            esac
          done < /tmp/mp4list.txt

          if [ "$want_portrait" -ne 1 ]; then
            echo "::error::portrait intro (1080x1920) with audio is missing from the APK"; rc=1
          fi
          if [ "$want_landscape" -ne 1 ]; then
            echo "::error::landscape intro (1920x1080) with audio is missing from the APK"; rc=1
          fi

          # the resource names must exist too, so the Kotlin R.raw.* lookups resolve
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 2>/dev/null | sort | tail -1)
          "$AAPT2" dump resources "$APK" > /tmp/res.txt 2>/dev/null || true
          for n in intro_portrait game_space_intro; do
            if grep -q "raw/$n" /tmp/res.txt; then
              say "  resource raw/$n present"
            else
              echo "::error::resource raw/$n is not in the APK"; rc=1
            fi
          done

          say "media audit rc=$rc"
          exit $rc

      # The runner log is not always retrievable after the fact, so publish the
      # verification report to a dedicated branch to keep the result auditable.
      # Work happens in a throwaway clone so the build workspace (and the APK in
      # app/build) is never touched.
      - name: Publish verification report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f verify-report.txt || echo "no report produced" > verify-report.txt
          WORK=$(mktemp -d)
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORK/repo"
          cd "$WORK/repo"
          git checkout --orphan report 2>/dev/null || git checkout -B report
          git rm -rf --quiet . >/dev/null 2>&1 || true
          cp "$GITHUB_WORKSPACE/verify-report.txt" verify-report.txt
          git add -f verify-report.txt
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "release verification report ${GITHUB_REF_NAME} [skip ci]" || true
          git push -f origin HEAD:release-verify-report

      - name: Report errors as annotations
        if: failure()
        run: |
          grep -E "(^e: |error:|What went wrong|Could not|FAILURE:|Execution failed|R8:|Missing class)" build.log | head -25 | while IFS= read -r line; do
            echo "::error::${line:0:240}"
          done

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/GamersHub-${GITHUB_REF_NAME:-dev}.apk"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GamersHub-apk
          path: dist/*.apk

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

      - name: Publish nightly (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "GamersHub — latest build"
          prerelease: true
          files: dist/*.apk
